# ----------------------------------------
# PostgreSQL Benchmark Tuning Configuration
# Optimized for pg_basebackup + CRC32C
# NOT SAFE FOR PRODUCTION
# ----------------------------------------

# Durability (Disabled for performance)
fsync = off
synchronous_commit = off
full_page_writes = off

# WAL (Write-Ahead Logging) Minimization
wal_level = replica
archive_mode = off
max_wal_senders = 1
max_wal_size = 1GB
wal_compression = off

# Memory & Caching
shared_buffers = 128MB
work_mem = 16MB
maintenance_work_mem = 64MB

# Checkpointing
checkpoint_timeout = 30min
checkpoint_completion_target = 0.9

# Autovacuum (Optional: Disable for cleaner benchmark)
autovacuum = off

# Background writer (Optional: Reduce I/O)
bgwriter_delay = 500ms
bgwriter_lru_maxpages = 0

# Parallelism (Optional: minimize background CPU load)
max_parallel_workers = 0
max_worker_processes = 1
max_parallel_maintenance_workers = 1
